<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>KINOLOMI PLAYER</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #0c0d14;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      padding: 16px;
      overflow-x: hidden;
    }
    .header {
      width: 100%;
      max-width: 650px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    .logo {
      font-weight: 800;
      font-size: 1.2rem;
      letter-spacing: 1px;
      background: linear-gradient(90deg, #ff416c, #ff4b2b);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .badge {
      background: rgba(255, 255, 255, 0.1);
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 0.75rem;
      color: #aaa;
    }
    .player-container {
      width: 100%;
      max-width: 650px;
      position: relative;
      padding-top: 56.25%; /* 16:9 Соотношение */
      background: #000;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
    }
    .player-container iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }
    .info-card {
      width: 100%;
      max-width: 650px;
      margin-top: 16px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 14px;
      padding: 14px 16px;
    }
    .info-title {
      font-size: 0.95rem;
      font-weight: 600;
      margin-bottom: 6px;
    }
    .info-desc {
      font-size: 0.8rem;
      color: #8c8c9e;
      line-height: 1.4;
    }
    .tg-btn {
      width: 100%;
      max-width: 650px;
      margin-top: 20px;
      padding: 14px;
      border-radius: 12px;
      border: none;
      background: linear-gradient(90deg, #ff416c, #ff4b2b);
      color: white;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-decoration: none;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="logo">🍿 KINOLOMI</div>
    <div class="badge">HD ПЛЕЕР</div>
  </div>

  <div class="player-container">
    <iframe id="videoPlayer" src="" allowfullscreen allow="autoplay; encrypted-media"></iframe>
  </div>

  <div class="info-card">
    <div class="info-title" id="movieTitle">Загрузка серии...</div>
    <div class="info-desc">Приятного просмотра! Новые серии и дорамы выходят ежедневно в нашем канале.</div>
  </div>

  <a class="tg-btn" href="https://t.me/kinolomi" target="_blank">
    📢 Перейти в канал @kinolomi
  </a>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand(); // Разворачиваем окно на весь экран смартфона

    // Достаем video_id из URL параметров (?v=ID_ВИДЕО&t=НАЗВАНИЕ)
    const urlParams = new URLSearchParams(window.location.search);
    const videoId = urlParams.get('v');
    const title = urlParams.get('t');

    if (title) {
      document.getElementById('movieTitle').innerText = decodeURIComponent(title);
    }

    if (videoId) {
      // Подставляем встроенный плеер без лишнего UI и рекомендаций
      document.getElementById('videoPlayer').src = 
        `https://www.youtube-nocookie.com/embed/${videoId}?autoplay=1&rel=0&modestbranding=1`;
    } else {
      document.getElementById('movieTitle').innerText = "Ошибка: Видео не найдено";
    }
  </script>
</body>
</html>
